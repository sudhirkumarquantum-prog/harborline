name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Orchestrator
        run: mvn -B -f orchestrator/pom.xml test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Concierge
        run: python3 -m unittest discover -s concierge/tests -v
      - name: Clerk
        run: PYTHONPATH=clerk:concierge python3 -m unittest discover -s clerk/tests -v
